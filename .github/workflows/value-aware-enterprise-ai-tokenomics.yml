name: value-aware-enterprise-ai-tokenomics

on:
  push:
    paths:
      - "value-aware-enterprise-ai-tokenomics/**"
      - ".github/workflows/value-aware-enterprise-ai-tokenomics.yml"
  pull_request:
    paths:
      - "value-aware-enterprise-ai-tokenomics/**"
      - ".github/workflows/value-aware-enterprise-ai-tokenomics.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: value-aware-enterprise-ai-tokenomics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify research package
        run: make verify
