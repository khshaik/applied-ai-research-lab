name: action-evidence-safety-research

on:
  push:
    paths:
      - "action-evidence-safety-research/**"
      - ".github/workflows/action-evidence-safety-research.yml"
  pull_request:
    paths:
      - "action-evidence-safety-research/**"
      - ".github/workflows/action-evidence-safety-research.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: action-evidence-safety-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify repository boundary
        run: python3 scripts/verify_repository.py
      - name: Run RAER v1 tests
        run: python3 studies/raer/evaluation/test_raer_benchmark.py
      - name: Run RAER v2 tests
        run: python3 studies/raer/evaluation/v2/test_raer_v2_design.py

