name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification dependencies
        run: >-
          python -m pip install --upgrade pip pytest requests PyYAML PyPDF2
          numpy matplotlib python-docx Pillow pypdf==6.16.1
      - run: make verify
