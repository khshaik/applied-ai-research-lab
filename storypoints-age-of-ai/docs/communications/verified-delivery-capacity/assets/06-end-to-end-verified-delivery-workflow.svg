<rect x="58" y="853" width="445" height="364" rx="29" fill="none" stroke="#B84408" stroke-width="2"/>
<circle cx="106" cy="906" r="33" fill="#B84408"/>
<text x="106" y="918" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="308" y="903" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">VERIFY EVIDENCE</text>
<text x="308" y="937" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">READINESS</text>
<circle cx="280" cy="1060" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="280" y="1072" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#B84408" text-anchor="middle">ERS</text>
<text x="280" y="1143" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Present, current, traceable</text>
<text x="280" y="1170" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">and independently checkable</text>
<rect x="590" y="855" width="450" height="360" rx="28" fill="#FFF7F0" stroke="#B84408" stroke-width="5"/>
<rect x="593" y="853" width="445" height="364" rx="29" fill="none" stroke="#B84408" stroke-width="2"/>
<circle cx="641" cy="906" r="33" fill="#B84408"/>
<text x="641" y="918" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="843" y="903" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">APPLY GATE</text>
<text x="843" y="937" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">DECISION</text>
<circle cx="815" cy="1060" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="815" y="1072" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#B84408" text-anchor="middle">GATE</text>
<text x="815" y="1143" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Pass, conditional, fail or N/A</text>
<text x="815" y="1170" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">with accountable rationale</text>
