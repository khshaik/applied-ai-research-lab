<text x="288" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">DEFINE DELIVERY</text>
<text x="288" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">OUTCOME</text>
