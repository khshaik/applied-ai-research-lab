<text x="743" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">FREEZE t0</text>
<text x="743" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">EVIDENCE</text>
<circle cx="715" cy="515" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="715" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">t0</text>
<text x="715" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Archive only planning-time</text>
<text x="715" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">inputs; prevent leakage</text>
<rect x="965" y="310" width="410" height="390" rx="28" fill="#F3F7FF" stroke="#0B2554" stroke-width="5"/>
<rect x="968" y="308" width="405" height="394" rx="29" fill="none" stroke="#0B2554" stroke-width="2"/>
<circle cx="1016" cy="361" r="33" fill="#0B2554"/>
<text x="1016" y="373" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="1198" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">PROFILE DEMAND</text>
<text x="1198" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">DRIVERS</text>
<circle cx="1170" cy="515" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="1170" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">PDD</text>
<text x="1170" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Intent, propagation, context,</text>
<text x="1170" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">assurance and coordination</text>
<rect x="1420" y="310" width="410" height="390" rx="28" fill="#F3F7FF" stroke="#0B2554" stroke-width="5"/>
<rect x="1423" y="308" width="405" height="394" rx="29" fill="none" stroke="#0B2554" stroke-width="2"/>
<circle cx="1471" cy="361" r="33" fill="#0B2554"/>
<text x="1471" y="373" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1653" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">FORECAST ROLE ×</text>
<text x="1653" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">STAGE TOUCH</text>
<circle cx="1625" cy="515" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="1625" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">R×S</text>
<text x="1625" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">P50/P80 active service</text>
<text x="1625" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">by required role and stage</text>
<rect x="1875" y="310" width="410" height="390" rx="28" fill="#F3F7FF" stroke="#0B2554" stroke-width="5"/>
<rect x="1878" y="308" width="405" height="394" rx="29" fill="none" stroke="#0B2554" stroke-width="2"/>
<circle cx="1926" cy="361" r="33" fill="#0B2554"/>
<text x="1926" y="373" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="2108" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">RECONCILE CAPACITY</text>
<text x="2108" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">AND QUEUES</text>
<circle cx="2080" cy="515" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="2080" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">CAP</text>
<text x="2080" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Calendars, blackouts,</text>
<text x="2080" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">allocations and existing work</text>
<rect x="2330" y="310" width="410" height="390" rx="28" fill="#F3F7FF" stroke="#0B2554" stroke-width="5"/>
<rect x="2333" y="308" width="405" height="394" rx="29" fill="none" stroke="#0B2554" stroke-width="2"/>
<circle cx="2381" cy="361" r="33" fill="#0B2554"/>
<text x="2381" y="373" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="2563" y="358" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">MODEL DELIVERY</text>
<text x="2563" y="392" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#0B2554" text-anchor="middle">FLOW</text>
<circle cx="2535" cy="515" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="2535" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">FLOW</text>
<text x="2535" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Dependencies, FIFO service,</text>
<text x="2535" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">pauses and bounded rework</text>
