<text x="260" y="527" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#0B2554" text-anchor="middle">OUTCOME</text>
<text x="260" y="628" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Acceptance, deadline,</text>
<text x="260" y="655" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">risk tier and boundaries</text>
<rect x="510" y="310" width="410" height="390" rx="28" fill="#F3F7FF" stroke="#0B2554" stroke-width="5"/>
<rect x="513" y="308" width="405" height="394" rx="29" fill="none" stroke="#0B2554" stroke-width="2"/>
