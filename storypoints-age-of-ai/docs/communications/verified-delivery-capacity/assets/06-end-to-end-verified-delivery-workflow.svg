<text x="1933" y="903" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">FORECAST VERIFIED</text>
<text x="1933" y="937" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">DELIVERY</text>
<circle cx="1905" cy="1060" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="1905" y="1072" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#B84408" text-anchor="middle">VDC</text>
<text x="1905" y="1143" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Completion probability, items,</text>
<text x="1905" y="1170" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">bottleneck, touch, wait and block</text>
<rect x="2240" y="855" width="500" height="360" rx="28" fill="#FFF7F0" stroke="#B84408" stroke-width="5"/>
<rect x="2243" y="853" width="495" height="364" rx="29" fill="none" stroke="#B84408" stroke-width="2"/>
<circle cx="2291" cy="906" r="33" fill="#B84408"/>
<text x="2291" y="918" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">10</text>
<text x="2518" y="903" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">OBSERVE AND</text>
<text x="2518" y="937" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="25" font-weight="700" fill="#B84408" text-anchor="middle">RECALIBRATE</text>
<circle cx="2490" cy="1060" r="58" fill="#FFFFFF" stroke="#111111" stroke-width="5"/>
<text x="2490" y="1072" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="20" font-weight="700" fill="#B84408" text-anchor="middle">LEARN</text>
<text x="2490" y="1143" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">Compare forecast with outcome;</text>
<text x="2490" y="1170" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">update later waves only</text>
<rect x="1125" y="895" width="445" height="280" rx="34" fill="#FFFFFF" stroke="#B84408" stroke-width="5"/>
<rect x="1128" y="893" width="440" height="284" rx="35" fill="none" stroke="#B84408" stroke-width="2"/>
<text x="1347" y="951" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="28" font-weight="700" fill="#B84408" text-anchor="middle">EVIDENCE +</text>
<text x="1347" y="986" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="28" font-weight="700" fill="#B84408" text-anchor="middle">READINESS GATE</text>
<text x="1347" y="1038" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="middle">PASS or CONDITIONAL</text>
<text x="1347" y="1068" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#4D4D4D" text-anchor="middle">continues to forecast</text>
<text x="1347" y="1110" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#111111" text-anchor="middle">FAIL: rework or stop</text>
<text x="1347" y="1140" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="18" font-weight="400" fill="#111111" text-anchor="middle">N/A: document rationale</text>
<polyline points="2744,1035 2760,1035 2760,1572 35,1572 35,505 47,505" fill="none" stroke="#B84408" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
<text x="1400" y="1550" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="22" font-weight="700" fill="#B84408" text-anchor="middle">VERIFIED OUTCOMES FEED A LATER CALIBRATION WAVE; THE ORIGINAL t0 SNAPSHOT REMAINS IMMUTABLE</text>
<rect x="300" y="1625" width="2200" height="123" rx="24" fill="#F8F6F1" stroke="#0B2554" stroke-width="5"/>
<text x="1400" y="1668" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="28" font-weight="700" fill="#0B2554" text-anchor="middle">CORE PRINCIPLE</text>
<text x="1400" y="1715" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="21" font-weight="400" fill="#111111" text-anchor="middle">Plan the constrained role-stage. Keep touch, wait and block separate. Count completion only when risk-tier evidence is ready.</text>
<text x="1400" y="1775" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="17" font-weight="400" fill="#4D4D4D" text-anchor="middle">Conceptual workflow — not a cognitive-load measure, individual-surveillance tool, empirical result, or universal Story Point replacement</text>
</svg>
