<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1800" viewBox="0 0 2800 1800" role="img" aria-labelledby="title desc">
<title id="title">From AI-Assisted Work to Verified Delivery</title>
<desc id="desc">A directional ten-step workflow. Steps one through six move left to right, turn into steps seven through ten, pass through an evidence-readiness gate, and loop verified outcomes back to the next immutable planning snapshot.</desc>
<rect width="2800" height="1800" fill="#FFFDF8"/>
<defs><marker id="arrowBlack" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#111111"/></marker><marker id="arrowOrange" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#B84408"/></marker></defs>
<text x="1400" y="95" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="70" font-weight="700" fill="#111111" text-anchor="middle">From AI-Assisted Work to Verified Delivery</text>
<text x="1400" y="155" font-family="Comic Sans MS, Bradley Hand, sans-serif" font-size="27" font-weight="400" fill="#111111" text-anchor="middle">An end-to-end capacity, evidence and flow workflow for planning what can be delivered—not only what can be generated</text>
