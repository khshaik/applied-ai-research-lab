<text x="1400" y="750" font-family="Bradley Hand, Comic Sans MS, sans-serif" font-size="21" font-weight="700" fill="#0B2554" text-anchor="middle">DELIVERY EXECUTION TO EVIDENCE CHECKPOINT</text>
